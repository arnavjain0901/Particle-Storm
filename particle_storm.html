
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Storm | Gesture Experience</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #03030b;
    font-family: Arial, sans-serif;
    color: white;
}

#scene {
    position: fixed;
    inset: 0;
    z-index: 0;
}

#hand-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
}

#webcam {
    position: fixed;
    width: 1px;
    height: 1px;
    opacity: 0;
}

#hud {
    position: fixed;
    top: 28px;
    left: 30px;
    z-index: 5;
    pointer-events: none;
}

#hud h1 {
    font-size: 24px;
    letter-spacing: 5px;
    font-weight: 600;
    text-shadow: 0 0 15px #8b5cf6;
}

#hud p {
    margin-top: 9px;
    font-size: 11px;
    letter-spacing: 3px;
    color: #a8a8c8;
}

#status {
    position: fixed;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    font-size: 13px;
    letter-spacing: 3px;
    color: #c4b5fd;
    text-align: center;
    text-shadow: 0 0 12px #8b5cf6;
    white-space: nowrap;
}

#camera-status {
    position: fixed;
    top: 30px;
    right: 30px;
    z-index: 5;
    font-size: 10px;
    letter-spacing: 2px;
    color: #a78bfa;
}

#instructions {
    position: fixed;
    right: 25px;
    bottom: 25px;
    z-index: 5;
    font-size: 11px;
    line-height: 2;
    color: #aaaac5;
    text-align: right;
    pointer-events: none;
}

#instructions span {
    color: #e9d5ff;
}

@media (max-width: 650px) {
    #hud {
        top: 18px;
        left: 18px;
    }

    #hud h1 {
        font-size: 17px;
    }

    #instructions {
        display: none;
    }
}
</style>
</head>

<body>

<div id="scene"></div>
<canvas id="hand-canvas"></canvas>
<video id="webcam" autoplay playsinline muted></video>

<div id="hud">
    <h1>PARTICLE STORM</h1>
    <p>GESTURE CONTROL SYSTEM</p>
</div>

<div id="camera-status">STARTING CAMERA</div>
<div id="status">INITIALIZING SYSTEM</div>

<div id="instructions">
    <span>OPEN PALM</span> — EXPLOSION<br>
    <span>FIST</span> — COMPRESSION<br>
    <span>INDEX FINGER</span> — ENERGY FOCUS<br>
    <span>PEACE SIGN</span> — VORTEX<br>
    <span>TWO HANDS</span> — SPREAD CONTROL
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
/* =================================
   THREE.JS SCENE
================================= */

const sceneContainer = document.getElementById("scene");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.z = 15;

const renderer = new THREE.WebGLRenderer({
    antialias: false,
    alpha: false,
    powerPreference: "high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setClearColor(0x03030b);

sceneContainer.appendChild(renderer.domElement);

/* =================================
   PARTICLES
================================= */

const PARTICLE_COUNT = 6000;

const geometry = new THREE.BufferGeometry();

const positions = new Float32Array(PARTICLE_COUNT * 3);
const basePositions = new Float32Array(PARTICLE_COUNT * 3);
const phases = new Float32Array(PARTICLE_COUNT);

for (let i = 0; i < PARTICLE_COUNT; i++) {
    const idx = i * 3;

    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const radius = 2.5 + Math.random() * 1.5;

    const x = radius * Math.sin(phi) * Math.cos(theta);
    const y = radius * Math.sin(phi) * Math.sin(theta);
    const z = radius * Math.cos(phi);

    basePositions[idx] = x;
    basePositions[idx + 1] = y;
    basePositions[idx + 2] = z;

    positions[idx] = x;
    positions[idx + 1] = y;
    positions[idx + 2] = z;

    phases[i] = Math.random() * Math.PI * 2;
}

geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(positions, 3)
);

const particleMaterial = new THREE.PointsMaterial({
    color: 0xb69cff,
    size: 0.045,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
});

const particles = new THREE.Points(geometry, particleMaterial);
scene.add(particles);

/* =================================
   ENERGY ORB
================================= */

const orb = new THREE.Mesh(
    new THREE.SphereGeometry(0.16, 20, 20),
    new THREE.MeshBasicMaterial({
        color: 0xf5d0fe,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending
    })
);

const glow = new THREE.Mesh(
    new THREE.SphereGeometry(0.42, 20, 20),
    new THREE.MeshBasicMaterial({
        color: 0x9333ea,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    })
);

scene.add(orb);
scene.add(glow);

/* =================================
   HAND SKELETON CANVAS
================================= */

const handCanvas = document.getElementById("hand-canvas");
const handCtx = handCanvas.getContext("2d");

function resizeHandCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    handCanvas.width = window.innerWidth * dpr;
    handCanvas.height = window.innerHeight * dpr;

    handCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

resizeHandCanvas();

const handConnections = [
    [0, 1], [1, 2], [2, 3], [3, 4],
    [0, 5], [5, 6], [6, 7], [7, 8],
    [5, 9], [9, 10], [10, 11], [11, 12],
    [9, 13], [13, 14], [14, 15], [15, 16],
    [13, 17], [17, 18], [18, 19], [19, 20],
    [0, 17]
];

function drawHandSkeleton(results) {
    const width = window.innerWidth;
    const height = window.innerHeight;

    handCtx.clearRect(0, 0, width, height);

    const allHands = results.multiHandLandmarks || [];

    for (const landmarks of allHands) {
        handCtx.lineWidth = 2.5;
        handCtx.lineCap = "round";
        handCtx.lineJoin = "round";
        handCtx.strokeStyle = "#a855f7";
        handCtx.shadowColor = "#c084fc";
        handCtx.shadowBlur = 10;

        for (const [aIndex, bIndex] of handConnections) {
            const a = landmarks[aIndex];
            const b = landmarks[bIndex];

            handCtx.beginPath();
            handCtx.moveTo(
                (1 - a.x) * width,
                a.y * height
            );
            handCtx.lineTo(
                (1 - b.x) * width,
                b.y * height
            );
            handCtx.stroke();
        }

        landmarks.forEach((point, index) => {
            const x = (1 - point.x) * width;
            const y = point.y * height;

            handCtx.beginPath();
            handCtx.arc(
                x,
                y,
                index === 8 ? 5 : 3,
                0,
                Math.PI * 2
            );

            handCtx.fillStyle =
                index === 8 ? "#ffffff" : "#e9d5ff";

            handCtx.fill();
        });
    }

    handCtx.shadowBlur = 0;
}

/* =================================
   STATE
================================= */

let currentGesture = 0;
let targetGesture = 0;

let currentStream = 0;
let targetStream = 0;

let currentVortex = 0;
let targetVortex = 0;

let currentScale = 1;
let targetScale = 1;

const currentFocus = new THREE.Vector3(0, 0, 0);
const targetFocus = new THREE.Vector3(0, 0, 0);

let activeGesture = "IDLE";

const statusText = document.getElementById("status");
const cameraStatus = document.getElementById("camera-status");

/* =================================
   HELPERS
================================= */

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

function distance(a, b) {
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    const dz = (a.z || 0) - (b.z || 0);

    return Math.sqrt(dx * dx + dy * dy + dz * dz);
}

function fingerExtended(landmarks, tip, pip) {
    return landmarks[tip].y < landmarks[pip].y;
}

function getGesture(landmarks) {
    const index = fingerExtended(landmarks, 8, 6);
    const middle = fingerExtended(landmarks, 12, 10);
    const ring = fingerExtended(landmarks, 16, 14);
    const pinky = fingerExtended(landmarks, 20, 18);

    const count =
        Number(index) +
        Number(middle) +
        Number(ring) +
        Number(pinky);

    if (index && middle && !ring && !pinky) {
        return "PEACE";
    }

    if (index && !middle && !ring && !pinky) {
        return "POINT";
    }

    if (count >= 4) {
        return "OPEN";
    }

    if (count === 0) {
        return "FIST";
    }

    return "NEUTRAL";
}

/* Map a normalized hand point into the visible 3D scene. */
function handToWorld(point) {
    const depth = camera.position.z;
    const visibleHeight =
        2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * depth;

    const visibleWidth =
        visibleHeight * camera.aspect;

    return new THREE.Vector3(
        (0.5 - point.x) * visibleWidth,
        (0.5 - point.y) * visibleHeight,
        0
    );
}

/* =================================
   HAND CONTROL
================================= */

function handleHands(results) {
    const detectedHands = results.multiHandLandmarks || [];

    drawHandSkeleton(results);

    if (detectedHands.length === 0) {
        targetGesture = 0;
        targetStream = 0;
        targetVortex = 0;
        targetScale = 1;

        activeGesture = "IDLE";
        statusText.textContent = "PARTICLE STORM";
        return;
    }

    if (detectedHands.length >= 2) {
        const a = detectedHands[0][9];
        const b = detectedHands[1][9];

        targetGesture = 0;
        targetStream = 0;
        targetVortex = 0;

        const midpoint = {
            x: (a.x + b.x) / 2,
            y: (a.y + b.y) / 2,
            z: (a.z + b.z) / 2
        };

        const spread = distance(a, b);

        targetScale = clamp(0.65 + spread * 2.3, 0.7, 2.5);
        targetFocus.copy(handToWorld(midpoint));

        activeGesture = "TWO HANDS";
        statusText.textContent = "TWO HAND EXPANSION";
        return;
    }

    targetScale = 1;

    const hand = detectedHands[0];
    const gesture = getGesture(hand);

    if (gesture === "OPEN") {
        targetGesture = 1;
        targetStream = 0;
        targetVortex = 0;
        targetFocus.set(0, 0, 0);

        activeGesture = "OPEN";
        statusText.textContent = "PARTICLE EXPLOSION";
    }
    else if (gesture === "FIST") {
        targetGesture = -1;
        targetStream = 0;
        targetVortex = 0;
        targetFocus.set(0, 0, 0);

        activeGesture = "FIST";
        statusText.textContent = "ENERGY COMPRESSION";
    }
    else if (gesture === "POINT") {
        targetGesture = 0;
        targetStream = 1;
        targetVortex = 0;

        targetFocus.copy(handToWorld(hand[8]));

        activeGesture = "POINT";
        statusText.textContent = "FINGERTIP ENERGY FOCUS";
    }
    else if (gesture === "PEACE") {
        targetGesture = 0;
        targetStream = 0;
        targetVortex = 1;
        targetFocus.set(0, 0, 0);

        activeGesture = "PEACE";
        statusText.textContent = "PARTICLE VORTEX";
    }
    else {
        targetGesture = 0;
        targetStream = 0;
        targetVortex = 0;
        targetFocus.set(0, 0, 0);

        activeGesture = "NEUTRAL";
        statusText.textContent = "CAMERA ACTIVE";
    }
}

/* =================================
   MEDIAPIPE
================================= */

const videoElement = document.getElementById("webcam");

const hands = new Hands({
    locateFile: (file) =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.65,
    minTrackingConfidence: 0.6
});

hands.onResults(handleHands);

const cameraFeed = new Camera(videoElement, {
    onFrame: async () => {
        await hands.send({ image: videoElement });
    },
    width: 640,
    height: 480
});

cameraFeed.start()
    .then(() => {
        cameraStatus.textContent = "CAMERA ONLINE";
    })
    .catch((error) => {
        console.error(error);
        cameraStatus.textContent = "CAMERA ERROR";
        statusText.textContent = "CHECK CAMERA PERMISSIONS";
    });

/* =================================
   ANIMATION
================================= */

const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);
    const elapsed = clock.elapsedTime;

    // Frame-rate independent easing
    const ease = 1 - Math.exp(-delta * 6);

    currentGesture +=
        (targetGesture - currentGesture) * ease;

    currentStream +=
        (targetStream - currentStream) * ease;

    currentVortex +=
        (targetVortex - currentVortex) * ease;

    currentScale +=
        (targetScale - currentScale) * ease;

    currentFocus.lerp(targetFocus, ease);

    const expansion = 1 + currentGesture * 1.15;

    for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        const phase = phases[i];

        const wobble =
            1 + Math.sin(elapsed * 1.5 + phase) * 0.012;

        const extraWobble =
            currentGesture > 0
            ? Math.sin(elapsed * 4 + phase) *
              0.025 * currentGesture
            : 0;

        const factor =
            (expansion + extraWobble) * wobble * currentScale;

        let x = basePositions[idx] * factor;
        let y = basePositions[idx + 1] * factor;
        let z = basePositions[idx + 2] * factor;

        /* ENERGY FOCUS */
        if (currentStream > 0.001) {
            const t = currentStream;

            // Collapse the large cloud
            const collapse = 0.025;

            const collapsedX = x * collapse;
            const collapsedY = y * collapse;
            const collapsedZ = z * collapse;

            const collapseBlend = Math.min(t * 2.2, 1);
            const focusBlend = clamp((t - 0.2) / 0.8, 0, 1);

            x += (collapsedX - x) * collapseBlend;
            y += (collapsedY - y) * collapseBlend;
            z += (collapsedZ - z) * collapseBlend;

            // Form a compact, swirling ball around the fingertip
            const angle = phase + elapsed * 2.4;
            const radius = 0.13 + (i % 9) * 0.012;

            const orbX =
                currentFocus.x + Math.cos(angle) * radius;

            const orbY =
                currentFocus.y + Math.sin(angle) * radius;

            const orbZ =
                Math.sin(angle * 1.7) * radius;

            x += (orbX - x) * focusBlend;
            y += (orbY - y) * focusBlend;
            z += (orbZ - z) * focusBlend;
        }

        /* VORTEX */
        if (currentVortex > 0.001) {
            const angle =
                elapsed * 3.5 * currentVortex +
                y * 1.8 * currentVortex;

            const cosA = Math.cos(angle);
            const sinA = Math.sin(angle);

            const vortexX = x * cosA - z * sinA;
            const vortexZ = x * sinA + z * cosA;

            x += (vortexX - x) * currentVortex;
            z += (vortexZ - z) * currentVortex;
        }

        positions[idx] = x;
        positions[idx + 1] = y;
        positions[idx + 2] = z;
    }

    geometry.attributes.position.needsUpdate = true;

    /* ORB GLOW */
    orb.material.opacity = currentStream * 0.95;
    glow.material.opacity = currentStream * 0.25;

    const pulse = 1 + Math.sin(elapsed * 7) * 0.12;

    orb.scale.setScalar(pulse);
    glow.scale.setScalar(pulse);

    orb.position.copy(currentFocus);
    glow.position.copy(currentFocus);

    /* IDLE ROTATION */
    particles.rotation.y += delta * 0.12;
    particles.rotation.x += delta * 0.035;

    renderer.render(scene, camera);
}

animate();


// ================================
// CONTROLS API
// ================================

window.ParticleStormAPI = {
    setColor(color) {
        particleMaterial.color.set(color);
        glow.material.color.set(color);
        orb.material.color.set(color);
    },

    setSize(size) {
        particleMaterial.size = Number(size);
    },

    setGlow(value) {
        const intensity = Number(value);
        particleMaterial.opacity = intensity;
        glow.material.opacity = intensity * 0.28;
        orb.material.opacity = intensity;
    },

    setEffect(effect) {
        console.log("Selected effect:", effect);
        // Manual effects will be connected in the next step.
    }
};

/* =================================
   RESIZE
================================= */

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

    resizeHandCanvas();
});
</script>

<script src="control.js"></script>
</body>
</html>
